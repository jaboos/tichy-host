<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Silent Guest">
  <!--
    The mark is the mechanic: a plate above the bar.

    The brass rule is the laťka, the one number every plate is scored against,
    and the disc sitting over it is a plate that cleared it. Deliberately not a
    cloche or a chef's hat — those say "restaurant", and this game is not about
    restaurants. It is about being measured against a line that keeps moving.

    Built to survive 16px: one rule, one disc, nothing thinner than 6 units, and
    its own dark ground so it never has to sit on the browser's.
  -->
  <rect width="64" height="64" rx="15" fill="#0E0D0B" />
  <path d="M9 40h46" stroke="#D8A24A" stroke-width="6" stroke-linecap="round" />
  <circle cx="32" cy="29" r="12" fill="#F2EDE4" />
</svg>
