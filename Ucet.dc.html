<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#14100D; }
  a { color:#D4A24C; text-decoration:none; }
  a:hover { color:#F5EFE7; }
</style>
</helmet>
<div style="min-height:100vh;background:#14100D;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.022'/></svg>&quot;);display:flex;justify-content:center;font-family:Inter,sans-serif;color:#F5EFE7;">
<div style="width:100%;max-width:390px;padding:22px 20px 34px;box-sizing:border-box;">

  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;">
    <div style="font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#A89A88;">Karta sezóny</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:#A89A88;">4:5 · 1080 × 1350</div>
  </div>

  <div ref="{{ ucetRef }}" style="position:relative;aspect-ratio:4/5;width:100%;border-radius:6px;overflow:hidden;background:#14100D;background-image:radial-gradient(120% 70% at 50% 0%,rgba(212,162,76,.10),rgba(20,16,13,0) 60%);box-shadow:0 26px 54px -26px rgba(0,0,0,.95);border:1px solid #3A2F26;display:flex;align-items:stretch;padding:13px 15px 15px;box-sizing:border-box;">
    <div style="position:relative;flex:1;background:#1F1915;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23p)' opacity='0.035'/></svg>&quot;);box-shadow:0 14px 28px -16px rgba(0,0,0,.9);display:flex;flex-direction:column;padding:0 17px 16px;box-sizing:border-box;overflow:hidden;">

      <div style="height:6px;margin:0 -17px;background-image:radial-gradient(circle at 4px 0px, #14100D 3.4px, rgba(0,0,0,0) 3.5px);background-size:9px 6px;flex:none;"></div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:11px;flex:none;">
        <div style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:25px;letter-spacing:.16em;text-indent:.16em;line-height:1;">TICHÝ HOST</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#A89A88;">{{ podtitul }}</div>
      </div>

      <div style="display:flex;align-items:center;gap:7px;margin:12px 0 11px;flex:none;">
        <div style="height:1px;flex:1;background:linear-gradient(to right,rgba(212,162,76,0),#D4A24C);"></div>
        <div style="width:3px;height:3px;border-radius:50%;background:#D4A24C;"></div>
        <div style="height:1px;flex:1;background:linear-gradient(to left,rgba(212,162,76,0),#D4A24C);"></div>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;gap:9px;flex:none;">
        <div style="font-size:24px;line-height:1;color:#D4A24C;text-shadow:0 0 18px rgba(212,162,76,.55);">★</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.1em;color:#D4A24C;text-transform:uppercase;">{{ hvezdaText }}</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:9px;margin-top:14px;flex:none;">
        <sc-for list="{{ radky }}" as="r" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;gap:2px;">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#A89A88;">{{ r.popisek }}</div>
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;">
              <div style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.02em;color:#F5EFE7;">{{ r.hodnota }}</div>
              <div style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:#D4A24C;flex:none;">{{ r.cislo }}</div>
            </div>
            <sc-if value="{{ r.detail }}" hint-placeholder-val="{{ false }}">
              <div style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:10px;color:#A89A88;">{{ r.detail }}</div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="margin-top:14px;padding-top:11px;border-top:1px dashed #3A2F26;display:flex;flex-direction:column;gap:5px;flex:none;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#C9503F;">Cena</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.4;color:#F5EFE7;text-wrap:pretty;">{{ cenaText }}</div>
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:16px;line-height:1.3;color:#A89A88;text-wrap:pretty;">{{ vzkaz }}</div>
      </div>

      <div style="flex:1;min-height:8px;"></div>

      <div style="display:flex;gap:2px;align-items:flex-end;height:26px;flex:none;opacity:.75;">
        <sc-for list="{{ carovy }}" as="b" hint-placeholder-count="34">
          <div style="{{ b.style }}"></div>
        </sc-for>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:9px;flex:none;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;color:#D4A24C;">{{ seed }}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;color:#A89A88;text-transform:uppercase;">zahraj si stejnou kuchyni</div>
      </div>

      <div style="position:absolute;left:0;right:0;bottom:0;height:9px;background-image:radial-gradient(circle at 6px 9px, #14100D 6px, rgba(0,0,0,0) 6.5px);background-size:12px 9px;"></div>
    </div>
  </div>

  <div style="display:flex;gap:9px;margin-top:16px;">
    <button onClick="{{ kopirovat }}" style="flex:1;border:1px solid #3A2F26;border-radius:10px;padding:13px 10px;background:#1F1915;color:#F5EFE7;font-family:Inter,sans-serif;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;" style-hover="border-color:#A89A88">Zkopírovat text</button>
    <button onClick="{{ stahnout }}" style="flex:1;border:none;border-radius:10px;padding:13px 10px;background:linear-gradient(180deg,#E0B25E,#D4A24C);color:#14100D;font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 26px -14px rgba(212,162,76,.6);" style-hover="filter:brightness(1.07)" style-active="transform:translateY(1px)">Stáhnout obrázek</button>
  </div>

  <div style="text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:#A89A88;margin-top:12px;">{{ stav }}</div>

</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:700}}">
class Component extends DCLogic {
  state = { stav: 'Účtenka je připravená ke sdílení.' };
  ucetRef = React.createRef();

  textovaVerze() {
    return [
      'TICHÝ HOST · „U Dušana" · sezóna 1 · seed 7K3-MAREN',
      '★ udělena v 8. týdnu',
      'Nejlepší chod: Celer v popelu (17,2)',
      'Kuchař sezóny: Ilona Bartáková — 14 servisů, 0 vad',
      'Cena: Tobiáš Vrána odešel ve 13. večeru.',
      '      Vzkaz: „Myslel jsem, že si to pamatuješ."',
      '',
      'seed 7K3-MAREN — zahraj si stejnou kuchyni'
    ].join('\n');
  }

  kopirovat = async () => {
    const t = this.textovaVerze();
    try {
      await navigator.clipboard.writeText(t);
      this.setState({ stav: 'Text zkopírován do schránky.' });
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      document.body.removeChild(ta);
      this.setState({ stav: ok ? 'Text zkopírován do schránky.' : 'Schránka není dostupná — text označ ručně.' });
    }
  };

  stahnout = () => {
    const node = this.ucetRef.current;
    if (!node) return;
    this.setState({ stav: 'Vykresluji obrázek…' });
    const w = node.offsetWidth, h = node.offsetHeight;
    const klon = node.cloneNode(true);
    klon.style.margin = '0';
    const html = new XMLSerializer().serializeToString(klon);
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
      '<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px">' +
      html + '</div></foreignObject></svg>';
    const img = new Image();
    img.onload = () => {
      const m = 1080 / w;
      const c = document.createElement('canvas');
      c.width = Math.round(w * m); c.height = Math.round(h * m);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#14100D';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      try {
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = 'tichy-host-sezona-1-7K3-MAREN.png';
        a.click();
        this.setState({ stav: 'Obrázek stažen · 1080 × 1350.' });
      } catch (e) {
        this.setState({ stav: 'Obrázek nelze uložit — pořiď snímek obrazovky.' });
      }
    };
    img.onerror = () => this.setState({ stav: 'Obrázek nelze uložit — pořiď snímek obrazovky.' });
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  };

  renderVals() {
    const seed = '7K3-MAREN';
    const bars = [];
    for (let i = 0; i < 34; i++) {
      const k = (seed.charCodeAt(i % seed.length) * (i + 3)) % 7;
      bars.push({ style: 'width:' + (k % 3 === 0 ? '4px' : '2px') + ';height:' + (12 + k * 2) + 'px;background:' + (k > 4 ? '#D4A24C' : '#A89A88') + ';flex:none;' });
    }
    return {
      ucetRef: this.ucetRef,
      podtitul: '„U Dušana" · sezóna 1 · seed ' + seed,
      hvezdaText: 'udělena v 8. týdnu',
      radky: [
        { popisek: 'Nejlepší chod', hodnota: 'Celer v popelu', cislo: '17,2', detail: false },
        { popisek: 'Kuchař sezóny', hodnota: 'Ilona Bartáková', cislo: '★', detail: '14 servisů · 0 vad' }
      ],
      cenaText: 'Tobiáš Vrána odešel ve 13. večeru.',
      vzkaz: '„Myslel jsem, že si to pamatuješ."',
      carovy: bars,
      seed: 'seed ' + seed,
      kopirovat: this.kopirovat,
      stahnout: this.stahnout,
      stav: this.state.stav
    };
  }
}

</script>
</body>
</html>
