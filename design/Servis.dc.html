<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#14100D; }
  a { color:#D4A24C; text-decoration:none; }
  a:hover { color:#F5EFE7; }
  @keyframes tik { 0% { opacity:0; transform:scale(.6); } 25% { opacity:1; transform:scale(1); } 75% { opacity:1; } 100% { opacity:0; } }
  @keyframes zablesk { 0% { opacity:0; } 18% { opacity:.9; } 100% { opacity:0; } }
  @keyframes razba { 0% { opacity:0; transform:scale(1.6) rotate(-14deg); } 40% { opacity:1; transform:scale(.94) rotate(-8deg); } 100% { opacity:1; transform:scale(1) rotate(-8deg); } }
  @keyframes cekani { 0%,100% { opacity:.28; } 50% { opacity:.55; } }
  @keyframes najezd { 0% { transform:translateX(112%) rotate(1.5deg); opacity:0; } 70% { opacity:1; } 100% { transform:translateX(0) rotate(0); opacity:1; } }
</style>
</helmet>
<div onClick="{{ preskocit }}" style="min-height:100vh;background:#14100D;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.022'/></svg>&quot;);display:flex;justify-content:center;font-family:Inter,sans-serif;color:#F5EFE7;overflow-x:hidden;">
<div style="width:100%;max-width:390px;padding:20px 20px 104px;box-sizing:border-box;">

  <div style="display:flex;align-items:baseline;justify-content:space-between;">
    <div style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;">Servis</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.09em;color:#A89A88;text-transform:uppercase;">{{ hlavicka }}</div>
  </div>

  <div style="position:relative;margin-top:16px;height:16px;">
    <div style="position:absolute;left:0;right:0;top:5px;height:6px;border-radius:3px;background:linear-gradient(180deg,#4A4038,#2A221C 55%,#161210);box-shadow:0 6px 14px -8px rgba(0,0,0,.9),inset 0 1px 0 rgba(245,239,231,.16);"></div>
    <div style="position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 6px;">
      <sc-for list="{{ klipy }}" as="c" hint-placeholder-count="7">
        <div style="width:5px;height:16px;border-radius:2px;background:linear-gradient(180deg,#6B5B49,#2A221C);box-shadow:0 2px 6px -3px rgba(0,0,0,.9);"></div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top:18px;background:#1F1915;border:1px solid #3A2F26;border-radius:10px;padding:14px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;box-shadow:0 12px 28px -18px rgba(0,0,0,.9);">
    <div style="display:flex;flex-direction:column;gap:5px;">
      <div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#A89A88;">Mezisoučet večera</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:38px;font-weight:500;line-height:1;letter-spacing:-.02em;color:#F5EFE7;">{{ soucet }}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:11px;">
      <div style="color:#6FA36B;">{{ poctyProslo }}</div>
      <div style="color:#D4A24C;">{{ poctyHvezda }}</div>
      <div style="color:#C9503F;">{{ poctyVada }}</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
    <sc-for list="{{ bony }}" as="b" hint-placeholder-count="6">
      <div style="{{ b.wrapStyle }}">
        <div style="{{ b.cardStyle }}">
          <div style="height:5px;background-image:radial-gradient(circle at 3px 0px, #14100D 2.6px, rgba(0,0,0,0) 2.7px);background-size:8px 5px;"></div>
          <div style="padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px;">
            <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:10px;letter-spacing:.08em;color:#A89A88;">
              <div>{{ b.stul }}</div>
              <div>{{ b.cas }}</div>
            </div>
            <div style="{{ b.nazevStyle }}">{{ b.nazev }}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;color:#A89A88;text-transform:uppercase;">{{ b.post }}</div>
              <div style="{{ b.bodyStyle }}">{{ b.body }}</div>
            </div>
            <sc-if value="{{ b.pozn }}" hint-placeholder-val="{{ false }}">
              <div style="{{ b.poznStyle }}">{{ b.pozn }}</div>
            </sc-if>
          </div>
          <sc-if value="{{ b.skrt }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;left:8px;right:8px;top:52%;height:2px;background:#C9503F;transform:rotate(-2.5deg);box-shadow:0 0 12px -2px rgba(201,80,63,.9);"></div>
          </sc-if>
          <sc-if value="{{ b.hvezda }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;right:12px;top:16px;font-size:44px;line-height:1;color:#D4A24C;opacity:.9;text-shadow:0 0 22px rgba(212,162,76,.55);animation:razba .55s cubic-bezier(.2,.9,.3,1) both;">★</div>
          </sc-if>
          <sc-if value="{{ b.hvezda }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(224,178,94,.5) 50%,rgba(255,255,255,0) 65%);animation:zablesk 1.1s ease-out .2s both;pointer-events:none;"></div>
          </sc-if>
          <sc-if value="{{ b.tik }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;right:12px;top:12px;font-family:'IBM Plex Mono',monospace;font-size:15px;color:#6FA36B;animation:tik 1.4s ease-out both;">✓</div>
          </sc-if>
        </div>
      </div>
    </sc-for>

    <sc-for list="{{ cekajici }}" as="w" hint-placeholder-count="2">
      <div style="height:58px;border:1px dashed #3A2F26;border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;animation:cekani 2.4s ease-in-out infinite;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;color:#A89A88;text-transform:uppercase;">{{ w.popis }}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#A89A88;">tiskne se</div>
      </div>
    </sc-for>
  </div>

</div>

<div style="position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:16px 20px 20px;background:linear-gradient(to top,#14100D 60%,rgba(20,16,13,0));pointer-events:none;">
  <div style="width:100%;max-width:350px;display:flex;flex-direction:column;gap:7px;align-items:center;">
    <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:18px;line-height:1.3;text-align:center;color:#F5EFE7;text-wrap:pretty;">{{ komentar }}</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#A89A88;">{{ napoveda }}</div>
  </div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:900},&quot;pauzaUprostred&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Ceremonie&quot;},&quot;komentar&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Druhá vlna. Marek už třetí hodinu na ohni.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Ceremonie&quot;}}">
class Component extends DCLogic {
  state = { reveal: 0, soucet: 0 };
  timers = [];

  bony = [
    { cas: '20:41', stul: 'Stůl 2 · 1. chod', nazev: 'Consommé z pečené kachny', post: 'Omáčky · Sedlák', typ: 'ok', body: 6 },
    { cas: '20:44', stul: 'Stůl 6 · 1. chod', nazev: 'Máslo z kysané smetany, žitný chléb', post: 'Studená · Rezková', typ: 'ok', body: 5 },
    { cas: '20:49', stul: 'Stůl 6 · 2. chod', nazev: 'Candát, kopr, kůrka ze žita', post: 'Oheň · Dostál', typ: 'hvezda', body: 14, pozn: 'Host odložil příbor a díval se na talíř.' },
    { cas: '20:53', stul: 'Stůl 9 · 2. chod', nazev: 'Jelení hřbet, jalovec', post: 'Oheň · Dostál', typ: 'vada', body: -9, pozn: 'Přesolený základ. Vráceno do kuchyně.' },
    { cas: '20:58', stul: 'Stůl 4 · 3. chod', nazev: 'Celer pečený v soli', post: 'Studená · Bartošová', typ: 'ok', body: 7 },
    { cas: '21:06', stul: 'Stůl 6 · 3. chod', nazev: 'Sýry z Vysočiny, medovina', post: 'Dezerty · Vávrová', typ: 'hvezda', body: 16, pozn: 'Poprosil o jméno sýraře.', pointa: true }
  ];

  componentDidMount() { this.naplanuj(0); }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }

  naplanuj(i) {
    if (i >= this.bony.length) return;
    const pauza = this.props.pauzaUprostred ?? true;
    if (pauza && i === 4) return;
    const t = setTimeout(() => {
      this.setState({ reveal: i + 1 });
      this.dopocitej(this.bony.slice(0, i + 1).reduce((a, b) => a + b.body, 0));
      try { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); } catch (e) {}
      this.naplanuj(i + 1);
    }, i === 0 ? 420 : (this.bony[i - 1] && this.bony[i - 1].typ === 'hvezda' ? 1500 : 1150));
    this.timers.push(t);
  }

  dopocitej(cil) {
    if (this.raf) cancelAnimationFrame(this.raf);
    const od = this.state.soucet, t0 = performance.now(), dur = 520;
    const krok = (t) => {
      const k = Math.min((t - t0) / dur, 1);
      const e = 1 - Math.pow(1 - k, 3);
      this.setState({ soucet: Math.round(od + (cil - od) * e) });
      if (k < 1) this.raf = requestAnimationFrame(krok);
    };
    this.raf = requestAnimationFrame(krok);
  }

  preskocit = () => {
    this.timers.forEach(clearTimeout);
    this.timers = [];
    if (this.state.reveal >= this.bony.length) return;
    this.setState({ reveal: this.bony.length });
    this.dopocitej(this.bony.reduce((a, b) => a + b.body, 0));
  };

  renderVals() {
    const { reveal, soucet } = this.state;
    const videne = this.bony.slice(0, reveal);
    const bony = videne.map((b, i) => {
      const posledni = i === reveal - 1;
      const vada = b.typ === 'vada';
      const hvezda = b.typ === 'hvezda';
      const okraj = vada ? 'rgba(201,80,63,.55)' : (b.pointa ? '#D4A24C' : (hvezda ? 'rgba(212,162,76,.45)' : '#3A2F26'));
      return {
        cas: b.cas, stul: b.stul, nazev: b.nazev, post: b.post,
        pozn: b.pozn || false,
        skrt: vada, hvezda: hvezda, tik: b.typ === 'ok' && posledni,
        body: (b.body > 0 ? '+' : '') + b.body,
        wrapStyle: 'transform:' + (vada ? 'translateY(16px) rotate(-3.2deg)' : 'translateY(0)') + ';opacity:' + (vada ? '.6' : '1') + ';transition:transform .45s cubic-bezier(.3,.8,.3,1) .35s,opacity .45s ease .35s;',
        cardStyle: 'position:relative;overflow:hidden;border-radius:4px;background:' + (b.pointa ? '#2A221C' : '#1F1915') + ';border:1px solid ' + okraj + ';box-shadow:' + (b.pointa ? '0 16px 34px -16px rgba(212,162,76,.5)' : '0 12px 26px -18px rgba(0,0,0,.95)') + ';animation:najezd .42s cubic-bezier(.2,.9,.25,1) ' + (i * 0.08).toFixed(2) + 's both;' + (b.pointa ? 'outline:1px solid rgba(212,162,76,.2);outline-offset:3px;' : ''),
        nazevStyle: 'font-family:\'Cormorant Garamond\',serif;font-weight:600;font-size:' + (b.pointa ? '21px' : '18px') + ';line-height:1.2;color:' + (vada ? '#A89A88' : '#F5EFE7') + ';text-wrap:pretty;' + (vada ? 'text-decoration:line-through;text-decoration-color:rgba(201,80,63,.7);' : ''),
        bodyStyle: 'font-family:\'IBM Plex Mono\',monospace;font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;color:' + (vada ? '#C9503F' : (hvezda ? '#D4A24C' : '#6FA36B')) + ';',
        poznStyle: 'font-size:11.5px;line-height:1.4;color:' + (vada ? '#C9503F' : '#A89A88') + ';border-top:1px solid ' + (vada ? 'rgba(201,80,63,.25)' : '#3A2F26') + ';padding-top:7px;'
      };
    });

    const zbyva = this.bony.length - reveal;
    return {
      klipy: [0,1,2,3,4,5,6].map(i => ({ i })),
      hlavicka: '20:58 · 34 krytů · ' + reveal + '/' + this.bony.length,
      soucet: (soucet > 0 ? '+' : '') + soucet,
      poctyProslo: videne.filter(b => b.typ === 'ok').length + ' prošlo',
      poctyHvezda: videne.filter(b => b.typ === 'hvezda').length + ' hvězdný talíř',
      poctyVada: videne.filter(b => b.typ === 'vada').length + ' vada',
      bony,
      cekajici: Array.from({ length: Math.max(zbyva, 0) }, (_, i) => ({ popis: 'Chod ' + (reveal + i + 1) })),
      komentar: this.props.komentar ?? 'Druhá vlna. Marek už třetí hodinu na ohni.',
      napoveda: zbyva > 0 ? 'Klepni pro přeskočení' : 'Servis uzavřen',
      preskocit: this.preskocit
    };
  }
}

</script>
</body>
</html>
